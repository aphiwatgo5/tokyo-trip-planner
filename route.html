<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Sim · Tokyo Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Mitr:wght@300;400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="data.js?v=6"></script>
<script src="app.js?v=5"></script>
<style>
  :root{
    --ink:#20242E; --muted:#5A6270; --paper:#ECEEE8;
    --momiji:#CE4A2B; --momiji-soft:#F3D9CF; --pine:#275145; --pine2:#2F5E50;
    --straw:#D79A35; --line:#DCDDD4; --train:#33506F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:"Sarabun",system-ui,sans-serif; font-size:14px;}
  #app{display:flex; flex-direction:column; height:100dvh;}
  .topbar{background:linear-gradient(155deg,#21433A,#2C5648 60%,#1C3A31); color:#F4F1E9; padding:10px 14px;}
  .topbar .row1{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .topbar h1{font-family:"Chonburi"; font-weight:400; font-size:19px; color:#fff; margin:0;}
  .topbar .eyebrow{font-family:"Mitr"; letter-spacing:.14em; text-transform:uppercase; font-size:9.5px; color:var(--straw);}
  .tbtn{font-family:"Mitr"; font-size:12px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08);
    color:#F4F1E9; border-radius:9px; padding:5px 11px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:5px;}
  .tbtn:hover{background:rgba(255,255,255,.16);}
  .daybar{background:#fff; border-bottom:1px solid var(--line); padding:7px 12px; display:flex; gap:6px; overflow-x:auto; align-items:center;}
  .dpill{flex:0 0 auto; font-family:"Mitr"; font-size:12px; border:1px solid var(--line); background:#F4F5F2; border-radius:18px; padding:5px 12px; cursor:pointer; white-space:nowrap;}
  .dpill.on{background:var(--pine2); color:#fff; border-color:var(--pine2);}
  .main{flex:1; display:flex; min-height:0;}
  #map{flex:1; min-width:0; z-index:1;}
  .side{width:330px; background:#fff; border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0;}
  .side-head{padding:10px 12px 8px; border-bottom:1px solid var(--line);}
  .side-head h2{font-family:"Mitr"; font-weight:600; font-size:14px; margin:0;}
  .side-head .sub{font-size:11px; color:var(--muted);}
  .ctrls{display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; align-items:center;}
  .ctrls button{font-family:"Mitr"; font-size:12px; border:1px solid var(--line); background:#F4F5F2; border-radius:8px; padding:6px 10px; cursor:pointer;}
  .ctrls button.play{background:var(--pine2); color:#fff; border-color:var(--pine2); min-width:64px;}
  .ctrls select{font-family:"Mitr"; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:5px 6px; background:#FBFCFA;}
  #tl{flex:1; overflow-y:auto; padding:8px 10px;}
  .tl-item{display:flex; gap:8px; padding:7px 8px; border-radius:10px; margin-bottom:4px; border:1px solid transparent; cursor:pointer;}
  .tl-item:hover{background:#F8FAF6;}
  .tl-item.now{background:#EAF0EC; border-color:#BFD4C4;}
  .tl-item.done{opacity:.55;}
  .tl-num{flex:0 0 22px; height:22px; border-radius:50%; background:var(--pine2); color:#fff; font-family:"Mitr"; font-size:11px;
    display:flex; align-items:center; justify-content:center; margin-top:2px;}
  .tl-item.transit .tl-num{background:var(--train);}
  .tl-body{flex:1; min-width:0;}
  .tl-time{font-family:"Mitr"; font-size:10.5px; color:var(--momiji);}
  .tl-name{font-weight:600; font-size:12.5px; line-height:1.3;}
  .tl-meta{font-size:10.5px; color:var(--muted);}
  .scrub{padding:8px 12px 10px; border-top:1px solid var(--line);}
  .scrub input[type=range]{width:100%; accent-color:var(--pine2);}
  .status{font-size:10.5px; color:var(--muted); font-family:"Mitr"; margin-top:4px; min-height:14px;}
  .leg-walk{stroke-dasharray:6 7;}
  .mk-num{width:26px; height:26px; border-radius:50%; background:var(--pine2); border:2px solid #fff; color:#fff;
    font-family:"Mitr"; font-size:11px; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,.4);}
  .mk-num.tr{background:var(--train);}
  .avatar{width:20px; height:20px; border-radius:50%; background:var(--momiji); border:3px solid #fff; box-shadow:0 2px 8px rgba(206,74,43,.6); transition:none;}
  .leaflet-popup-content{font-family:"Sarabun"; font-size:12.5px; margin:8px 10px;}
  @media(max-width:820px){
    .main{flex-direction:column;}
    .side{width:100%; border-left:none; border-top:1px solid var(--line); max-height:46dvh;}
    #map{min-height:44dvh;}
    .topbar h1{font-size:16px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="row1">
      <div>
        <div class="eyebrow">🧭 Route Simulation</div>
        <h1>จำลองเส้นทางรายวัน</h1>
      </div>
      <span style="flex:1"></span>
      <a class="tbtn" href="index.html">📋 การ์ด</a>
      <a class="tbtn" href="sheet.html">📊 ตาราง</a>
      <a class="tbtn" href="map.html">🗺️ แผนที่</a>
    </div>
  </div>
  <div class="daybar" id="daybar"></div>
  <div class="main">
    <div id="map"></div>
    <div class="side">
      <div class="side-head">
        <h2 id="day-title">—</h2>
        <div class="sub" id="day-sub"></div>
      </div>
      <div class="ctrls">
        <button class="play" id="btn-play">▶ เล่น</button>
        <select id="speed">
          <option value="1">1×</option>
          <option value="4" selected>4×</option>
          <option value="16">16×</option>
        </select>
        <button id="btn-refresh" title="ดึงเส้นทางเดินจริงจาก Valhalla (ออนไลน์)">🔄 เส้นทาง</button>
        <button id="btn-fit">⤢ ทั้งวัน</button>
      </div>
      <div id="tl"></div>
      <div class="scrub">
        <input type="range" id="scrub" min="0" max="1000" value="0">
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="routing.js?v=3"></script>
<script>
// ================= STATE =================
let S=tpLoad();
if(!S.parked) S.parked=[];
let curDay=0;
let routeModel=null;     // {stops, legs} from RK.buildDayRoute
let layerRoute=null, layerStops=null, avatar=null;
let anim=null;           // playback state
const map=L.map('map',{zoomControl:true}).setView([35.71,139.775],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

const $=id=>document.getElementById(id);
function toast(msg){ APP.toast(msg); }

// ================= DAY BAR =================
function renderDaybar(){
  $('daybar').innerHTML=S.days.map((d,i)=>
    `<button class="dpill ${i===curDay?'on':''}" data-d="${i}">${d.d} · ${d.title.slice(0,14)}</button>`).join('');
  $('daybar').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ curDay=+b.dataset.d; loadDay(); });
}

// ================= LOAD & DRAW A DAY =================
async function loadDay(forceRefresh){
  const day=S.days[curDay];
  $('day-title').textContent=`${day.d} · ${day.title}`;
  $('day-sub').textContent=`${day.dow||''} · ${rowsOf(day).length} กิจกรรม`;
  renderDaybar();
  $('status').textContent='กำลังโหลด…';
  stopAnim();
  clearLayers();
  const base=(S.settings.baseGeo&&isFinite(S.settings.baseGeo[0]))
    ? {name:S.settings.baseName||'โรงแรม', geo:{lat:S.settings.baseGeo[0],lng:S.settings.baseGeo[1]}}
    : {name:S.settings.baseName||'โรงแรม Ueno', geo:{lat:35.7121,lng:139.7780}};
  if(forceRefresh){
    try{ localStorage.removeItem('tp-routes-v1'); }catch(e){}
  }
  routeModel=await RK.buildDayRoute(day, base, (i,n)=>{ $('status').textContent=`เส้นทาง ${i}/${n}…`; });
  drawRoute();
  renderTimeline();
  const walks=routeModel.legs.filter(l=>l.type==='walk').length;
  const trans=routeModel.legs.filter(l=>l.type==='transit').length;
  const missing=rowsOf(day).length+1-routeModel.stops.length;
  $('status').textContent=`จุด ${routeModel.stops.length} · เดิน ${walks} ช่วง · รถ ${trans} ช่วง`
    +(missing>0?` · ⚠️ ${missing} กิจกรรมไม่มีพิกัด (กด 🔄 เพื่อค้นออนไลน์)`:'');
}
function rowsOf(day){ return day.variants[day.activeVariant].rows; }
function clearLayers(){
  if(layerRoute){ layerRoute.remove(); layerRoute=null; }
  if(layerStops){ layerStops.remove(); layerStops=null; }
  if(avatar){ avatar.remove(); avatar=null; }
}
function drawRoute(){
  const g=L.layerGroup().addTo(map); layerRoute=g;
  const s=L.layerGroup().addTo(map); layerStops=s;
  const bounds=[];
  routeModel.legs.forEach((leg,i)=>{
    if(leg.type==='transit'){
      const a=[leg.from.geo.lat,leg.from.geo.lng], b=[leg.to.geo.lat,leg.to.geo.lng];
      L.polyline([a,b],{color:'#33506F',weight:4,opacity:.85,dashArray:'2 8'}).addTo(g)
        .bindPopup(`<b>🚆 ${esc(leg.label||'รถไฟ')}</b><br>${esc(leg.from.name)} → ${esc(leg.to.name)}`);
    }else{
      L.polyline(leg.coords,{color:leg.straight?'#B9C4BC':'#2F5E50',weight:leg.straight?3:5,opacity:.9,className:'leg-walk'})
        .addTo(g).bindPopup(`<b>🚶 เดิน</b>${leg.minutes?` ~${leg.minutes} นาที (${leg.meters} ม.)`:''}<br>${esc(leg.from.name)} → ${esc(leg.to.name)}`);
      leg.coords.forEach(c=>bounds.push(c));
    }
  });
  routeModel.stops.forEach((st,i)=>{
    const transit=st.row&&st.row.line&&st.row.line!=='เดิน';
    const m=L.marker([st.geo.lat,st.geo.lng],{icon:L.divIcon({className:'',html:`<div class="mk-num ${transit?'tr':''}">${i+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]})});
    m.bindPopup(`<b>${i+1}. ${esc(st.name)}</b>${st.row&&st.row.time?`<br>🕒 ${st.row.time}`:''}${st.row&&st.row.line?`<br>🚆 ${esc(st.row.line)}`:''}`);
    m.addTo(s); bounds.push([st.geo.lat,st.geo.lng]);
  });
  if(bounds.length>1) map.fitBounds(L.latLngBounds(bounds).pad(0.12));
  else if(bounds.length===1) map.setView(bounds[0],15);
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ================= TIMELINE =================
function renderTimeline(){
  const day=S.days[curDay];
  $('tl').innerHTML=routeModel.stops.map((st,i)=>{
    const r=st.row;
    const transit=r&&r.line&&r.line!=='เดิน';
    return `<div class="tl-item ${transit?'transit':''}" data-stop="${i}">
      <div class="tl-num">${i+1}</div>
      <div class="tl-body">
        <div class="tl-time">${r&&r.time?r.time:'—'}${r&&TAGS[r.tag]?' · '+TAGS[r.tag].icon:''}</div>
        <div class="tl-name">${esc(st.name)}</div>
        <div class="tl-meta">${esc(r&&r.line?r.line:(r&&r.ft||''))}</div>
      </div></div>`;
  }).join('');
  $('tl').querySelectorAll('[data-stop]').forEach(el=>el.onclick=()=>{
    const st=routeModel.stops[+el.dataset.stop];
    map.flyTo([st.geo.lat,st.geo.lng],16);
    highlight(+el.dataset.stop);
  });
}
function highlight(i){
  $('tl').querySelectorAll('.tl-item').forEach((el,j)=>{
    el.classList.toggle('now', j===i);
    el.classList.toggle('done', j<i);
  });
  const el=$('tl').querySelector(`[data-stop="${i}"]`);
  if(el) el.scrollIntoView({block:'nearest'});
}

// ================= PLAYBACK =================
// Build a flat track: [{segIndex, from coords idx..}] walking legs only; transit jumps with a pause.
function buildTrack(){
  const track=[];
  routeModel.legs.forEach((leg,i)=>{
    if(leg.type==='walk'&&leg.coords&&leg.coords.length>1){
      track.push({type:'walk',leg,pts:leg.coords});
    }else{
      track.push({type:'jump',leg,pts:[[leg.from.geo.lat,leg.from.geo.lng],[leg.to.geo.lat,leg.to.geo.lng]]});
    }
  });
  return track;
}
function startAnim(){
  if(!routeModel) return;
  const track=buildTrack();
  if(!track.length) return;
  if(anim&&anim.playing) return;
  if(avatar){ avatar.remove(); avatar=null; }
  avatar=L.marker(track[0].pts[0],{icon:L.divIcon({className:'',html:'<div class="avatar"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map);
  anim={track, seg:0, t:0, playing:true, lastTs:null};
  $('btn-play').textContent='⏸ หยุด';
  requestAnimationFrame(stepAnim);
}
function stopAnim(keepScrub){
  if(anim){ anim.playing=false; anim=null; }
  $('btn-play').textContent='▶ เล่น';
  if(!keepScrub) $('scrub').value=0;
}
function stepAnim(ts){
  if(!anim||!anim.playing) return;
  if(anim.lastTs==null) anim.lastTs=ts;
  const dt=Math.min(0.05,(ts-anim.lastTs)/1000); anim.lastTs=ts;
  const speed=+$('speed').value;                                   // 1 / 4 / 16
  const seg=anim.track[anim.seg];
  const dur=seg.type==='walk'?Math.max(1.5,seg.pts.length/8):2;    // sec per segment at 1×
  anim.t+=dt*speed/dur;
  if(anim.t>=1){
    anim.seg++; anim.t=0;
    if(anim.seg>=anim.track.length){ finishAnim(); return; }
  }else{
    const s=anim.track[anim.seg];
    const idx=Math.min(s.pts.length-1,Math.floor(anim.t*s.pts.length));
    avatar.setLatLng(s.pts[idx]);
    if(s.leg&&s.leg.to&&s.leg.to.row){
      // highlight destination stop index
      const si=routeModel.stops.indexOf(s.leg.to);
      if(si>=0) highlight(Math.max(0,si-0));
    }
    $('scrub').value=Math.round(((anim.seg+anim.t)/anim.track.length)*1000);
  }
  requestAnimationFrame(stepAnim);
}
function finishAnim(){
  const last=routeModel.stops[routeModel.stops.length-1];
  if(last) map.flyTo([last.geo.lat,last.geo.lng],15);
  toast('จบการจำลอง — ถึงจุดสุดท้ายของวัน 🎉');
  stopAnim();
}
$('btn-play').onclick=()=>{ if(anim&&anim.playing){ stopAnim(true); } else startAnim(); };
$('btn-fit').onclick=()=>{ if(routeModel){ const b=routeModel.stops.map(s=>[s.geo.lat,s.geo.lng]); if(b.length>1) map.fitBounds(L.latLngBounds(b).pad(0.12)); else if(b.length===1) map.setView(b[0],15); } };
$('btn-refresh').onclick=()=>loadDay(true);
$('scrub').oninput=e=>{
  if(!routeModel) return;
  stopAnim(true);
  const track=buildTrack();
  if(!track.length) return;
  const f=(+e.target.value)/1000;
  const segIdx=Math.min(track.length-1,Math.floor(f*track.length));
  const seg=track[segIdx];
  const tIn=Math.min(1,f*track.length-segIdx);
  const idx=Math.min(seg.pts.length-1,Math.floor(tIn*seg.pts.length));
  if(!avatar){
    avatar=L.marker(seg.pts[idx],{icon:L.divIcon({className:'',html:'<div class="avatar"></div>',iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map);
  }
  avatar.setLatLng(seg.pts[idx]);
  if(seg.leg&&seg.leg.to){ const si=routeModel.stops.indexOf(seg.leg.to); if(si>=0) highlight(si); }
};

// ================= INIT =================
renderDaybar();
loadDay();
// plan edited in another tab/page → reload the current day's route
window.addEventListener('storage', e=>{
  if(e.key && (e.key.startsWith('tp-trip-')||e.key==='tp-trips-v1')){
    S=tpLoad();
    if(!S.parked) S.parked=[];
    if(curDay>=S.days.length) curDay=0;
    loadDay();
  }
});
</script>
</body>
</html>
